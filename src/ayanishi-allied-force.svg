<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">綾西島奪還作戦 味方戦力イメージ</title>
  <desc id="desc">第5艦隊の艦艇と、西部航空隊5機の戦闘機が綾西島へ向かう作戦図。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8ecff"/>
      <stop offset="100%" stop-color="#89b5dc"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f6e9e"/>
      <stop offset="100%" stop-color="#1b3f5e"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="960" height="270" fill="url(#sky)"/>
  <rect y="270" width="960" height="150" fill="url(#sea)"/>

  <g opacity="0.35" fill="#ffffff">
    <ellipse cx="120" cy="95" rx="52" ry="16"/>
    <ellipse cx="168" cy="95" rx="44" ry="14"/>
    <ellipse cx="560" cy="70" rx="70" ry="20"/>
    <ellipse cx="618" cy="72" rx="54" ry="17"/>
  </g>

  <g transform="translate(705 160)">
    <path d="M0 90 L100 20 L190 45 L220 92 L176 132 L80 132 Z" fill="#4b5563"/>
    <path d="M70 100 L90 66 L138 66 L160 100 Z" fill="#6b7280"/>
    <rect x="118" y="52" width="24" height="16" fill="#9ca3af"/>
    <text x="108" y="154" fill="#e5e7eb" font-size="20" font-weight="700">綾西島</text>
  </g>

  <g fill="#f8fafc" stroke="#0b2540" stroke-width="4" filter="url(#softShadow)">
    <path d="M140 290 L310 290 L340 320 L120 320 Z"/>
    <rect x="210" y="255" width="56" height="30" fill="#cbd5e1"/>
    <path d="M350 300 L500 300 L535 330 L332 330 Z"/>
    <rect x="422" y="268" width="42" height="28" fill="#cbd5e1"/>
    <path d="M520 288 L640 288 L670 312 L505 312 Z"/>
    <rect x="572" y="262" width="34" height="22" fill="#cbd5e1"/>
  </g>

  <g stroke="#9dd6ff" stroke-width="3" stroke-dasharray="8 8" fill="none" opacity="0.8">
    <path d="M675 315 C735 300 780 270 820 220"/>
    <path d="M530 332 C640 330 715 300 790 240"/>
  </g>

  <g fill="#f1f5f9" stroke="#0f172a" stroke-width="3" filter="url(#softShadow)">
    <path d="M130 118 L168 118 L202 102 L168 86 L130 86 L144 102 Z"/>
    <path d="M220 90 L250 90 L278 78 L250 66 L220 66 L232 78 Z"/>
    <path d="M280 132 L310 132 L338 120 L310 108 L280 108 L292 120 Z"/>
    <path d="M356 78 L386 78 L414 66 L386 54 L356 54 L368 66 Z"/>
    <path d="M432 114 L462 114 L490 102 L462 90 L432 90 L444 102 Z"/>
  </g>

  <g fill="#0b2540" font-family="sans-serif" font-weight="700">
    <text x="44" y="44" font-size="28">味方戦力：第5艦隊 + 西部航空隊5機</text>
    <text x="58" y="360" font-size="22" fill="#e2e8f0">第5艦隊 前進航路</text>
    <text x="58" y="390" font-size="18" fill="#bfdbfe">戦闘機隊は艦隊の上空援護に展開</text>
  </g>
</svg>
